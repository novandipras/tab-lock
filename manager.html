<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage tab locks</title>
  <link rel="stylesheet" href="manager.css">
  <script src="manager.js" defer></script>
</head>
<body>
  <main>
    <header class="page-header">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="5" y="10" width="14" height="11" rx="3"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
        </svg>
      </span>
      <div>
        <p class="eyebrow">Simple Tab Lock</p>
        <h1>Manage tab locks</h1>
      </div>
    </header>
    <section class="list-card" aria-labelledby="list-title">
      <div class="list-heading">
        <h2 id="list-title">Locked pages</h2>
        <button id="refresh" type="button">Refresh list</button>
      </div>
      <div class="list-actions">
        <span id="selection">0 selected</span>
        <button id="remove" type="button" disabled>Remove</button>
      </div>
      <div class="toolbar">
        <label><input id="all" type="checkbox"> Select all</label>
        <span>Page and URL</span>
      </div>
      <ul id="pages" aria-label="Locked pages"></ul>
      <div id="empty" hidden>
        <span class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="5" y="10" width="14" height="11" rx="3"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
          </svg>
        </span>
        <h3>No locked pages yet</h3>
      </div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-description">
      <h2 id="confirm-title">Remove locks?</h2>
      <p id="confirm-description"></p>
      <form method="dialog"><button value="cancel">Cancel</button><button value="remove">Remove locks</button></form>
    </dialog>
  </main>
</body>
</html>
